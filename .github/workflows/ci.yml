name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · types · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage # finance engine thresholds are enforced in apps/api/vitest.config.ts
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  integration:
    name: MongoDB integration (real replica set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.status().members[0].stateStr"
      - run: pnpm install --frozen-lockfile
      - name: Integration tests
        env:
          MONGO_URI: mongodb://localhost:27017/sfm_ci?replicaSet=rs0&directConnection=true
        run: pnpm --filter @sfm/api exec vitest run src/modules/payments/mongo-ledger-store.integration.test.ts

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ops/docker/Dockerfile.api -t sfm-api:ci .
